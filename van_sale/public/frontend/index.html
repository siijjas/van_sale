<html lang="en">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <meta name="theme-color" content="#FFFFFF" />

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  </head>
  <body class="font-[Inter]">
    <div id="app"></div>
    <script>
      // Apply persisted theme before first paint to avoid a flash.
      (function () {
        try {
          var p = localStorage.getItem('vansale-theme') || 'system';
          var dark = p === 'dark' || (p === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) {
            document.documentElement.classList.add('dark');
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute('content', '#0f172a');
          }
        } catch (e) {}
      })();
    </script>
    <script>
      // Disable PWA caching: unregister any existing service workers and avoid new registrations
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then((regs) => {
          regs.forEach((reg) => reg.unregister().catch(() => {}));
        });
      }
    </script>
  </body>
</html>
